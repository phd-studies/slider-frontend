<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Circular Carousel</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="carousel-item" style="--item-index: 1"><img src="https://picsum.photos/id/1/200/200" alt="Image 1"></div>
            <div class="carousel-item" style="--item-index: 2"><img src="https://picsum.photos/id/2/200/200" alt="Image 2"></div>
            <div class="carousel-item" style="--item-index: 3"><img src="https://picsum.photos/id/3/200/200" alt="Image 3"></div>
            <div class="carousel-item" style="--item-index: 4"><img src="https://picsum.photos/id/4/200/200" alt="Image 4"></div>
            <div class="carousel-item" style="--item-index: 5"><img src="https://picsum.photos/id/5/200/200" alt="Image 5"></div>
            <div class="carousel-item" style="--item-index: 6"><img src="https://picsum.photos/id/6/200/200" alt="Image 6"></div>
            <div class="carousel-item" style="--item-index: 7"><img src="https://picsum.photos/id/7/200/200" alt="Image 7"></div>
            <div class="carousel-item" style="--item-index: 8"><img src="https://picsum.photos/id/8/200/200" alt="Image 8"></div>
        </div>
    </div>
    <div class="content">
        <h1 data-text="3D Carousel">3D Carousel</h1>
    </div>
    <script src="script.js"></script>
</body>
</html>
